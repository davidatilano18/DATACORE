[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "datacore"
version = "0.1.0"
description = "Plataforma de gestión, monitoreo y análisis de datos empresariales (proyecto de estadía UPQ)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
