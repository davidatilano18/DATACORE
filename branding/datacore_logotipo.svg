  <text x="122" y="70" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="2" fill="#1B2A4A">DATA<tspan fill="#8A1538">CORE</tspan></text>
  <text x="125" y="98" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" letter-spacing="3.4" fill="#5B6B86">INTELIGENCIA DE DATOS</text>
</svg>
