  <g transform="translate(4 4) scale(0.93)">
    <polygon points="60,10 103,35 60,60 17,35" fill="#E9EDF3" stroke="#C9D2E0" stroke-width="1.5"/>
    <polygon points="17,35 60,60 60,110 17,85" fill="#1B2A4A"/>
    <polygon points="60,60 103,35 103,85 60,110" fill="#8A1538"/>
    <g stroke="#FFFFFF" stroke-width="7"><line x1="70.5" y1="101" x2="70.5" y2="84"/><line x1="81.5" y1="94.6" x2="81.5" y2="66"/><line x1="92.5" y1="88.2" x2="92.5" y2="48"/></g>
    <g stroke="#C9D2E0" stroke-width="2.5" stroke-linecap="round"><line x1="27" y1="52" x2="50" y2="65.5"/><line x1="27" y1="64" x2="50" y2="77.5"/><line x1="27" y1="76" x2="50" y2="89.5"/></g>
